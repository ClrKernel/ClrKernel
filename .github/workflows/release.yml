name: Release

# Pushing a tag like v0.5.0 runs the full test suite, packs every publishable
# package (all carry PackageId + README + icon), publishes them to nuget.org,
# and creates the GitHub Release with the .nupkg files attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # GitHub OIDC token for NuGet trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production # must match the environment on the nuget.org trusted publishing policy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify tag matches Directory.Build.props version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROPS_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          echo "tag=$TAG_VERSION props=$PROPS_VERSION"
          if [ "$TAG_VERSION" != "$PROPS_VERSION" ]; then
            echo "ERROR: tag v$TAG_VERSION does not match <Version>$PROPS_VERSION</Version> in Directory.Build.props" >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore ClrKernel.slnx

      - name: Build
        run: dotnet build ClrKernel.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ClrKernel.slnx -c Release --no-build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Jupyter tooling
        run: pip install jupyter nbclient nbconvert

      - name: Register kernelspec (dev layout)
        run: ./scripts/install-dev-kernel.sh Release

      - name: Execute smoke notebook (must pass)
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.kernel_name=clrkernel-dev \
            --output /tmp/smoke_out.ipynb test/notebooks/smoke.ipynb

      - name: Pack
        run: |
          dotnet pack src/ClrKernel/ClrKernel.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Core.Scripting/ClrKernel.Core.Scripting.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Core.Secrets/ClrKernel.Core.Secrets.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Core.JupyterKernel/ClrKernel.Core.JupyterKernel.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Core.LanguageServices/ClrKernel.Core.LanguageServices.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Core.ExtensionServer/ClrKernel.Core.ExtensionServer.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Core.Runner/ClrKernel.Core.Runner.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Core.Primitives/ClrKernel.Core.Primitives.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Language.Http/ClrKernel.Language.Http.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Language.Mermaid/ClrKernel.Language.Mermaid.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Language.PowerShell/ClrKernel.Language.PowerShell.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Database.Provider.SqlServer/ClrKernel.Database.Provider.SqlServer.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Language.Sql/ClrKernel.Language.Sql.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.AnalysisServices/ClrKernel.AnalysisServices.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Database.Provider.Fabric/ClrKernel.Database.Provider.Fabric.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Database/ClrKernel.Database.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Database.Provider.Oracle/ClrKernel.Database.Provider.Oracle.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Database.Provider.Odbc/ClrKernel.Database.Provider.Odbc.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Database.Provider.Jdbc/ClrKernel.Database.Provider.Jdbc.csproj -c Release --no-build -o artifacts/pkg
          ls -l artifacts/pkg

      # Trusted publishing: exchange the GitHub OIDC token for a short-lived
      # (1 hour, single-use) nuget.org API key. No stored secrets.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # Must be the policy CREATOR's username (personal profile), not the
          # org that owns the packages. Stored as a secret to keep it out of
          # the public YAML.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: |
          dotnet nuget push "artifacts/pkg/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/pkg/*.nupkg
          generate_release_notes: true
