# Dev-only: the databases and mail server for exercising ClrKernel.Jobs' non-default
# backends and its SMTP channel. Not used by CI or by the shipped tool.
#
#   docker compose -f dev/docker-compose.dbs.yml up -d
#
#   clrkernel-jobs serve --store postgres \
#     --connection-string "Host=localhost;Port=55432;Database=clrkernel_jobs;Username=postgres;Password=devonly"
#
#   clrkernel-jobs serve --store sqlserver \
#     --connection-string "Server=localhost,51433;Database=clrkernel_jobs;User Id=sa;Password=DevOnly!Passw0rd;TrustServerCertificate=True"
#
# Mailpit catches every message and shows it at http://localhost:8025 — point an
# email channel at host localhost, port 1025, startTls false, no user.
#
# The passwords here are local throwaways for containers bound to localhost. Real
# deployments resolve credentials from the OS credential store or CLRKERNEL_SECRET_*,
# never from a file like this one.

services:
  postgres:
    image: postgres:17
    ports: ['55432:5432']
    environment:
      POSTGRES_PASSWORD: devonly
      POSTGRES_DB: clrkernel_jobs
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: ['51433:1433']
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'DevOnly!Passw0rd'
    # The jobs database is created by the migrations on first start; the container
    # only needs to be up and reachable.

  mailpit:
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']
