<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline so there is no second request and no 404 in the console on every
         page load. currentColor picks up the tab's own light/dark treatment. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Cpath d='M4 5.2 6.4 8 4 10.8M7.6 11h4.6' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>ClrKernel Jobs</title>
    <!-- Before first paint, not in React: applying either of these after mount
         shows a frame of the wrong one on every load. The theme matters more
         than the accent here — a white flash on the way into a dark app is the
         thing people actually complain about.

         "system" is resolved to a real answer here rather than left to a media
         query, so the token layer has one source of truth and an explicit choice
         can override the OS. Kept in sync with theme/accent.ts and theme/theme.ts
         by accent.test.ts and theme.test.ts. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var a = localStorage.getItem('clrkernel-jobs-accent');
          root.dataset.accent =
            ['green', 'blue', 'violet', 'amber', 'rose'].indexOf(a) >= 0 ? a : 'green';
        } catch (e) {
          root.dataset.accent = 'green';
        }
        try {
          var m = localStorage.getItem('clrkernel-jobs-theme');
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.dataset.theme = m;
        } catch (e) {
          root.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
