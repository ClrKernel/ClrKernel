name: Release

# Pushing a tag like v0.5.0 runs the full test suite, packs every publishable
# package (all carry PackageId + README + icon), publishes them to nuget.org,
# and creates the GitHub Release with the .nupkg files attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # GitHub OIDC token for NuGet trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production # must match the environment on the nuget.org trusted publishing policy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify tag matches Directory.Build.props version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROPS_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          echo "tag=$TAG_VERSION props=$PROPS_VERSION"
          if [ "$TAG_VERSION" != "$PROPS_VERSION" ]; then
            echo "ERROR: tag v$TAG_VERSION does not match <Version>$PROPS_VERSION</Version> in Directory.Build.props" >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore ClrKernel.slnx

      - name: Build
        run: dotnet build ClrKernel.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ClrKernel.slnx -c Release --no-build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Jupyter tooling
        run: pip install jupyter nbclient nbconvert

      - name: Register kernelspec (dev layout)
        run: ./scripts/install-dev-kernel.sh Release

      - name: Execute smoke notebook (must pass)
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.kernel_name=clrkernel-dev \
            --output /tmp/smoke_out.ipynb test/notebooks/smoke.ipynb

      - name: Pack
        run: |
          dotnet pack src/ClrKernel/ClrKernel.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Core/ClrKernel.Core.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Jupyter/ClrKernel.Jupyter.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.LanguageServices/ClrKernel.LanguageServices.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Server/ClrKernel.Server.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Runner/ClrKernel.Runner.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Primitives/ClrKernel.Primitives.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Http/ClrKernel.Http.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Mermaid/ClrKernel.Mermaid.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.PowerShell/ClrKernel.PowerShell.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Sql/ClrKernel.Sql.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.AnalysisServices/ClrKernel.AnalysisServices.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Fabric/ClrKernel.Fabric.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Data/ClrKernel.Data.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Data.Oracle/ClrKernel.Data.Oracle.csproj -c Release --no-build -o artifacts/pkg
          dotnet pack src/ClrKernel.Data.Odbc/ClrKernel.Data.Odbc.csproj -c Release --no-build -o artifacts/pkg
          ls -l artifacts/pkg

      # Trusted publishing: exchange the GitHub OIDC token for a short-lived
      # (1 hour, single-use) nuget.org API key. No stored secrets.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # Must be the policy CREATOR's username (personal profile), not the
          # org that owns the packages. Stored as a secret to keep it out of
          # the public YAML.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: |
          dotnet nuget push "artifacts/pkg/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/pkg/*.nupkg
          generate_release_notes: true
