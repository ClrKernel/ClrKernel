# ClrKernel Studio behind nginx.
#
# Two things matter and the rest is ordinary reverse-proxy configuration:
#
#   1. Passkeys are bound to a domain. The name in the address bar has to be the
#      one Studio is told about (CLRKERNEL_STUDIO_RPID), and the full URL has to
#      be in CLRKERNEL_STUDIO_ORIGINS. Get this wrong and sign-in fails with the
#      browser refusing to use the credential — the server never sees it.
#
#   2. WebAuthn needs a secure context: HTTPS, or `localhost`. That is why this
#      file works over plain http on localhost for a test, and why the commented
#      block below is what you want on a real hostname.
#
# There is no WebSocket upgrade here because the app does not use one — the UI
# polls. Adding the Upgrade headers is harmless if your template already has
# them; leaving them out costs nothing.

upstream clrkernel_studio {
    # `studio` is the compose service name; use a host:port if nginx is outside.
    server studio:5000;
}

server {
    listen 80;
    server_name localhost;

    # Notebook output can be large — an executed .ipynb with a rendered grid in
    # it — and a notebook you save goes up the same way.
    client_max_body_size 32m;

    # A cell can run for as long as its job's timeout allows. The default 60s
    # would cut a long run's response off at the proxy while it kept running in
    # the kernel, which reads as "the run vanished".
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://clrkernel_studio;
        proxy_http_version 1.1;

        # Host must be the name the browser used: it is what the passkey origin
        # check is compared against.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

