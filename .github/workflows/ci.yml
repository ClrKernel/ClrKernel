name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ClrKernel.slnx

      - name: Verify formatting (dotnet format)
        run: dotnet format ClrKernel.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ClrKernel.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ClrKernel.slnx -c Release --no-build

  # The suite has only ever run on Linux, and the tool's users are largely on
  # Windows. Path separators, CRLF, file locking and the credential manager are
  # all things that differ there and that nothing was checking.
  #
  # A real VM rather than a Windows container: `mcr.microsoft.com/windows*` images
  # need a Windows host with Windows-containers mode, which no runner here has and
  # no Mac can have at all — and this needs a Credential Manager and a user
  # profile, which is what a VM is and a container is not.
  windows:
    name: Build + test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ClrKernel.slnx

      - name: Build
        run: dotnet build ClrKernel.slnx -c Release --no-restore

      # Formatting is checked once, on Linux: it is the same file either way, and
      # a second opinion about line endings is not worth a job failing over.
      - name: Test
        run: dotnet test ClrKernel.slnx -c Release --no-build

      # What the Windows checklist calls §2: the tool installs, is on PATH, and
      # the extension's entry point starts. Ordinary commands, so they are checked
      # by machine now rather than read off a list once per release.
      - name: Install the global tool and start it
        shell: pwsh
        run: |
          dotnet pack src/ClrKernel/ClrKernel.csproj -c Release --no-build -o artifacts
          dotnet tool install --global --add-source artifacts ClrKernel
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          clrkernel --version
          # `lsp` waits on stdio: it is what the extension launches, and what it
          # must not do is exit. Give it a moment and check it is still there.
          $p = Start-Process clrkernel -ArgumentList 'lsp' -PassThru -NoNewWindow `
                 -RedirectStandardInput NUL -RedirectStandardOutput lsp.out -RedirectStandardError lsp.err
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            Get-Content lsp.err -ErrorAction SilentlyContinue
            throw "clrkernel lsp exited with $($p.ExitCode) instead of waiting on stdio"
          }
          Stop-Process -Id $p.Id -Force

      # A notebook end to end, on Windows paths and with CRLF in the file — which
      # is the point, so it is written here rather than taken from `samples/`.
      # `hello.nb.md` would have been the obvious choice and calls httpbin, which
      # would make this job amber for reasons that have nothing to do with Windows.
      - name: Run a notebook headlessly
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          New-Item -ItemType Directory -Force -Path run-check | Out-Null
          Set-Content -Path run-check/smoke.nb.md -Value @'
          # Windows smoke

          ```csharp
          var greeting = "hello";
          ```

          ```csharp
          Console.WriteLine($"{greeting} from {System.IO.Path.DirectorySeparatorChar}");
          ```
          '@
          clrkernel run run-check/smoke.nb.md --output run-check/out.ipynb
          if (-not (Test-Path run-check/out.ipynb)) { throw "no artifact was written" }
          # State carried from the first cell to the second, and the artifact holds
          # what it printed rather than an empty output list.
          if ((Get-Content run-check/out.ipynb -Raw) -notmatch 'hello from') {
            Get-Content run-check/out.ipynb -Raw
            throw "the executed notebook does not contain the cell's output"
          }

  extension:
    name: VS Code extension (compile + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install
        run: npm ci
        working-directory: editors/vscode

      # tsc proves the extension is type-correct; the unit tests cover the parts with real
      # logic — the directives sent to the kernel, the version guard, the .nb.md serializer.
      - name: Compile
        run: npm run compile
        working-directory: editors/vscode

      - name: Test
        run: npm test
        working-directory: editors/vscode

  webapp:
    name: Studio web app (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/ClrKernel.Studio/webapp/package-lock.json

      - name: Install
        run: npm ci
        working-directory: src/ClrKernel.Studio/webapp

      # tsc proves the SPA is type-correct and vite proves it bundles; the unit
      # tests cover the renderer helpers, the only part with real logic.
      - name: Build
        run: npm run build
        working-directory: src/ClrKernel.Studio/webapp

      - name: Test
        run: npm test
        working-directory: src/ClrKernel.Studio/webapp

  studio-stores:
    name: Studio live backends (run store + connection dialects)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: clrkernel_studio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'CiOnly!Passw0rd'
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiOnly!Passw0rd' -C -Q 'select 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The same contract suite the other backends run, pointed at real servers:
      # the per-provider migrations and dialect differences only show up here.
      # CLRKERNEL_TEST_REQUIRE_LIVE makes a missing server fail the job rather than
      # skip, so this can never go green without touching a database.
      - name: Run the store contract tests
        run: dotnet test test/ClrKernel.Studio.UnitTest/ClrKernel.Studio.UnitTest.csproj
          --filter ClassName~RunStoreContractTest
        env:
          CLRKERNEL_TEST_REQUIRE_LIVE: '1'
          CLRKERNEL_STUDIO_TEST_POSTGRES: Host=localhost;Port=5432;Database=clrkernel_studio;Username=postgres;Password=ci-only
          CLRKERNEL_STUDIO_TEST_SQLSERVER: Server=localhost,1433;Database=clrkernel_studio;User Id=sa;Password=CiOnly!Passw0rd;TrustServerCertificate=True

      # unixodbc is a driver manager and ships no drivers; without one every ODBC
      # connection fails with "data source name not found". The same reason the
      # Studio image installs this pair.
      - name: Install an ODBC driver
        run: sudo apt-get update && sudo apt-get install --yes unixodbc odbc-postgresql

      # The Connections area against real backends: the object-tree queries, the
      # generated scripts and the reader loop are per-dialect and a closed port
      # proves only the error path. Oracle is not here — its image takes minutes to
      # start and gigabytes to pull, so that one stays a local gate.
      - name: Run the connection dialect tests
        run: dotnet test test/ClrKernel.Studio.UnitTest/ClrKernel.Studio.UnitTest.csproj
          --filter "ClassName~ConnectionsLiveTest|ClassName~PostgresLiveTest|ClassName~OdbcLiveTest"
        env:
          CLRKERNEL_TEST_REQUIRE_LIVE: '1'
          CLRKERNEL_STUDIO_TEST_SQL: Server=localhost,1433;Database=master;User Id=sa;Password=CiOnly!Passw0rd;TrustServerCertificate=True
          CLRKERNEL_STUDIO_TEST_POSTGRES: Host=localhost;Port=5432;Database=clrkernel_studio;Username=postgres;Password=ci-only
          CLRKERNEL_STUDIO_TEST_ODBC: Driver={PostgreSQL Unicode};Server=localhost;Port=5432;Database=clrkernel_studio;Uid=postgres;Pwd=ci-only

  studio-image:
    name: Studio Docker image (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Dockerfile builds the SPA and both tools from this commit, so this is
      # also the check that a from-scratch build of the whole thing works.
      - name: Build image
        run: docker build -f src/ClrKernel.Studio/Dockerfile -t clrkernel-studio .

      - name: Run a notebook job in the container
        run: |
          mkdir -p smoke && cat > smoke/hello.nb.md <<'EOF'
          ```csharp
          $"docker says {1 + 1}"
          ```
          EOF
          cat > smoke/hello.jobs.yaml <<'EOF'
          notebook: ./hello.nb.md
          jobs:
            - name: hello
          EOF
          docker run --rm -v "$PWD/smoke:/notebooks:ro" clrkernel-studio run hello

  notebook-smoke:
    name: Headless notebook smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Jupyter tooling
        run: pip install jupyter nbclient nbconvert

      - name: Build kernel
        run: dotnet build src/ClrKernel/ClrKernel.csproj -c Release

      - name: Register kernelspec (dev layout)
        run: ./scripts/install-dev-kernel.sh Release

      - name: Execute smoke notebook (must pass)
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.kernel_name=clrkernel-dev \
            --output /tmp/smoke_out.ipynb test/notebooks/smoke.ipynb

      - name: Execute failing notebook (must exit non-zero)
        run: |
          if jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.kernel_name=clrkernel-dev \
            --output /tmp/smokefail_out.ipynb test/notebooks/smoke-fail.ipynb; then
            echo "ERROR: failing notebook did not fail the run" >&2; exit 1
          else
            echo "Failing notebook correctly returned non-zero"
          fi

      - name: Verify no orphaned kernel processes
        run: |
          sleep 2
          if pgrep -f "ClrKerne[l].dll"; then
            echo "ERROR: orphaned kernel process found" >&2; exit 1
          fi
