<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline so there is no second request and no 404 in the console on every
         page load. The same mark the rail carries — lucide `book-open-check`,
         white on the brand square — so the tab and the app agree about what
         this is. Keep the two in step. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232563eb'/%3E%3Cg transform='translate(3.6 3.6) scale(0.7)' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 5v16'/%3E%3Cpath d='m16 12 2 2 4-4'/%3E%3Cpath d='M22 6V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2h4.001A2 2 0 0022 17v-1.344'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>ClrKernel Studio</title>
    <!-- Before first paint, not in React: applying either of these after mount
         shows a frame of the wrong one on every load. The theme matters more
         than the accent here — a white flash on the way into a dark app is the
         thing people actually complain about.

         "system" is resolved to a real answer here rather than left to a media
         query, so the token layer has one source of truth and an explicit choice
         can override the OS. Kept in sync with theme/accent.ts and theme/theme.ts
         by accent.test.ts and theme.test.ts. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var a = localStorage.getItem('clrkernel-studio-accent');
          root.dataset.accent =
            ['green', 'blue', 'violet', 'amber', 'rose'].indexOf(a) >= 0 ? a : 'green';
        } catch (e) {
          root.dataset.accent = 'green';
        }
        try {
          var m = localStorage.getItem('clrkernel-studio-theme');
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.dataset.theme = m;
        } catch (e) {
          root.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
