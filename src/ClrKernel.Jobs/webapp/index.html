<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline so there is no second request and no 404 in the console on every
         page load. currentColor picks up the tab's own light/dark treatment. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Cpath d='M4 5.2 6.4 8 4 10.8M7.6 11h4.6' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>ClrKernel Jobs</title>
    <!-- Before first paint, not in React: applying the accent after mount shows
         a frame of the default blue on every load for anyone who picked another.
         Kept in sync with theme/accent.ts by accent.test.ts. -->
    <script>
      (function () {
        try {
          var a = localStorage.getItem('clrkernel-jobs-accent');
          document.documentElement.dataset.accent =
            ['green', 'blue', 'violet', 'amber', 'rose'].indexOf(a) >= 0 ? a : 'green';
        } catch (e) {
          document.documentElement.dataset.accent = 'green';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
